<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta content="width=device-width, initial-scale=1" name="viewport" />
		<title>Player end-to-end page</title>
		<script src="./host.ts" type="module"></script>
		<style>
			:root {
				color-scheme: dark;
				font-family: system-ui, sans-serif;
				background-color: #171717;
			}

			body {
				margin: 0;
			}

			main {
				display: flex;
				flex-wrap: wrap;
				gap: 0.5rem;
				padding: 1rem;
			}

			main button {
				font: inherit;
			}
		</style>
	</head>
	<body>
		<main>
			<div data-pzm-track-id="long">
				<button data-pzm-play-track="long" type="button">Play long</button>
				<button data-pzm-queue-track="long" type="button">Queue long</button>
			</div>
			<div data-pzm-track-id="short">
				<button data-pzm-play-track="short" type="button">Play short</button>
				<button data-pzm-queue-track="short" type="button">Queue short</button>
			</div>
			<button data-pzm-queue-tracks="long short" type="button">Queue both</button>
			<button data-pzm-play-tracks="long short" data-pzm-play-from="short" type="button">
				Play both from short
			</button>
		</main>
		<div data-pzm-host style="position: fixed; inset: auto 0 0"></div>
	</body>
</html>
