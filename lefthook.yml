# Check-only; a hook that re-stages files sweeps in a concurrent session's edits
pre-commit:
  jobs:
    - name: format
      run: pnpm exec prettier --check --ignore-unknown {staged_files}

pre-push:
  jobs:
    - name: gate
      run: pnpm check

check:
  piped: true
  jobs:
    # Build first because each package type-checks against its dependencies' `dist` folders
    - name: build
      run: pnpm build
    - name: verify
      group:
        parallel: true
        jobs:
          - name: types
            run: pnpm check-types
          - name: format
            run: prettier --check . --cache --log-level warn
          - name: lint
            run: eslint --max-warnings 0 --cache --cache-location node_modules/.cache/eslint/
          - name: css
            run: stylelint "packages/*/src/**/*.css" --cache --cache-location node_modules/.cache/stylelint/
          # Uncached on purpose; a stale knip cache once reported a live devDependency as unused
          - name: unused
            run: knip
          - name: dupes
            run: fallow dupes --quiet
          # Health prints its report even at zero findings, so output shows only on failure
          - name: complexity
            run: out=$(fallow health --complexity --quiet 2>&1) || { printf '%s\n' "$out"; exit 1; }
          # `fallow health --css` never exits non-zero; audit gates the css-* rules, scoped to changed files
          # Audit diffs against origin/main, which the repo lacks until its first push
          - name: styling
            run: git rev-parse --verify --quiet origin/main >/dev/null || exit 0; fallow audit --gate all --quiet
          # Unfiltered, so it covers cycles, boundaries and suppressions; knip owns the unused-code rules
          - name: policy
            run: fallow dead-code --quiet
          - name: test
            run: vitest run --passWithNoTests

# The autofixers gate what they fix, so the verify group skips format, lint and css
fix:
  piped: true
  jobs:
    - name: autofix
      group:
        piped: true
        jobs:
          # Stylelint's fixes land before Prettier so they come out formatted
          - name: css
            run: stylelint "packages/*/src/**/*.css" --fix --cache --cache-location node_modules/.cache/stylelint/
          - name: format
            run: prettier --write . --cache --list-different
          - name: lint
            run: eslint --fix --max-warnings 0 --cache --cache-location node_modules/.cache/eslint/
    - name: build
      run: pnpm build
    # `fallow fix` stays unwired; it strips unused exports and would unexport work in progress
    - name: verify
      group:
        parallel: true
        jobs:
          - name: types
            run: pnpm check-types
          - name: unused
            run: knip
          - name: dupes
            run: fallow dupes --quiet
          - name: complexity
            run: out=$(fallow health --complexity --quiet 2>&1) || { printf '%s\n' "$out"; exit 1; }
          - name: styling
            run: git rev-parse --verify --quiet origin/main >/dev/null || exit 0; fallow audit --gate all --quiet
          - name: policy
            run: fallow dead-code --quiet
          - name: test
            run: vitest run --passWithNoTests
